# Live deployment: one paid Node service, one durable disk. No demo build/seed.
# Review current Render pricing/region and provide private values in its dashboard.
services:
  - type: web
    name: pointgh
    runtime: node
    plan: 0.5c-512mb
    region: frankfurt
    numInstances: 1
    buildCommand: npm ci --omit=dev
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    maxShutdownDelaySeconds: 30
    disk:
      name: pointgh-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: NODE_VERSION
        value: 22.22.3
      - key: NODE_ENV
        value: production
      - key: STORE_MODE
        value: live
      - key: HOST
        value: 0.0.0.0
      - key: DATA_DIR
        value: /var/data
      - key: PERSISTENT_STORAGE
        value: 'true'
      - key: SEED_ON_BOOT
        value: 'false'
      - key: SESSION_SECRET
        generateValue: true
      - key: PAYMENT_PROVIDER
        value: paystack
      - key: GATEWAY_MODE
        value: live
      - key: NOTIFICATIONS_ENABLED
        value: 'true'
      - key: OWNER_NAME
        sync: false
      - key: OWNER_EMAIL
        sync: false
      - key: OWNER_PHONE
        sync: false
      - key: OWNER_PASSWORD
        sync: false
      - key: PAYSTACK_SECRET_KEY
        sync: false
      - key: PAYSTACK_WEBHOOK_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: OWNER_NOTIFICATION_EMAIL
        sync: false
      - key: OWNER_NOTIFICATION_WHATSAPP
        sync: false
      - key: WHATSAPP_ACCESS_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_NUMBER_ID
        sync: false
      - key: WHATSAPP_ORDER_TEMPLATE
        sync: false
      - key: WHATSAPP_TEMPLATE_LANGUAGE
        value: en
      - key: WHATSAPP_API_VERSION
        value: v23.0
      - key: WHATSAPP_OWNER_OPT_IN
        sync: false
      - key: NOTIFICATION_CRON_SECRET
        generateValue: true
